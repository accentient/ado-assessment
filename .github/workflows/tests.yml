name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The tests only need to read the code.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pester:
    name: Pester (${{ matrix.shell }})
    runs-on: windows-latest

    # The script supports both PowerShell 7 (pwsh) and Windows PowerShell 5.1 (powershell).
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]

    # A step's own shell: key cannot read the matrix; the job's run defaults can.
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Pester
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.0
          (Get-Module Pester).Version.ToString()

      - name: Run tests
        run: |
          # The suite is hermetic: no credential is resolved, no live organization is queried, and
          # reports go to Pester's TestDrive, so nothing here needs secrets.
          Import-Module Pester -MinimumVersion 5.0
          $result = Invoke-Pester -Path tests -Output Detailed -PassThru
          "Passed: $($result.PassedCount)  Failed: $($result.FailedCount)  Skipped: $($result.SkippedCount)"
          if ($result.FailedCount -gt 0) { exit 1 }
